<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E2A47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BTJ Mergulho">
<title>BTJ Mergulho</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #0E2A47;
    background: #fff;
    min-height: 100vh;
    overscroll-behavior: none;
  }
  body {
    padding: 16px;
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(80px, env(safe-area-inset-bottom));
    max-width: 600px;
    margin: 0 auto;
  }
  input, button, textarea, select { font-family: inherit; }
  input[type="text"], input[type="tel"], input[type="number"], textarea, select {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border: 1px solid #D6E0EA;
    border-radius: 8px;
    background: #fff;
    color: #0E2A47;
    -webkit-appearance: none;
    appearance: none;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #3FA0D6;
    box-shadow: 0 0 0 3px rgba(63,160,214,0.15);
  }
  button { cursor: pointer; -webkit-appearance: none; appearance: none; }
  .label { font-size: 12px; color: #5C6B7A; margin: 0 0 6px; }

  .header-card {
    background: #D6E8F4;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  .header-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .header-info {
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 600; color: #0E2A47;
  }
  .header-info .sub { font-size: 12px; color: #5C6B7A; font-weight: 400; }
  .pill {
    font-size: 11px; padding: 4px 10px; border-radius: 999px; font-weight: 500;
  }
  .pill-online { background: #DFF4E6; color: #2E7D5B; }
  .pill-offline { background: #FBE9D6; color: #8B5A00; }

  .btn-link {
    font-size: 12px; padding: 6px 10px;
    border: 1px solid #D6E0EA; background: #fff;
    border-radius: 999px; color: #5C6B7A;
  }

  .bloco { margin-bottom: 16px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .btn-primario {
    width: 100%; padding: 18px;
    background: #0E2A47; color: white;
    border: none; border-radius: 8px;
    font-size: 17px; font-weight: 600;
    margin-bottom: 10px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-primario:active { background: #061833; transform: scale(0.99); }
  .btn-primario:disabled { opacity: 0.35; }

  .btn-azul {
    width: 100%; padding: 18px;
    background: #3FA0D6; color: white;
    border: none; border-radius: 8px;
    font-size: 17px; font-weight: 600; margin-bottom: 10px;
  }
  .btn-azul:active { background: #2A85B8; transform: scale(0.99); }
  .btn-azul:disabled { opacity: 0.35; }

  .btn-secundario {
    width: 100%; padding: 14px;
    background: #fff; color: #0E2A47;
    border: 1.5px solid #D6E0EA; border-radius: 8px;
    font-size: 15px; font-weight: 500; margin-bottom: 10px;
  }
  .btn-secundario:active { background: #F2F6FA; }

  .login-wrap { max-width: 500px; margin: 0 auto; padding: 10px 0; }
  .login-titulo { text-align: center; margin: 24px 0 24px; }
  .login-titulo .logo-btj {
    width: 110px; height: 110px;
    background: #0E2A47; border-radius: 12px;
    margin: 0 auto 12px;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; color: white;
  }
  .login-titulo .logo-btj .btj-text {
    border: 3px solid white; padding: 6px 14px;
    font-size: 22px; font-weight: 800; letter-spacing: 1px;
    border-radius: 4px; line-height: 1;
  }
  .login-titulo .logo-btj .aqua-text {
    font-size: 11px; margin-top: 6px;
    letter-spacing: 3px; font-weight: 600;
  }
  .login-titulo h1 { font-size: 20px; margin: 4px 0 2px; color: #0E2A47; font-weight: 600; }
  .login-titulo p { font-size: 13px; color: #5C6B7A; margin: 0; }

  .opcoes-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .opcao-btn {
    padding: 14px 8px;
    border: 1px solid #D6E0EA; border-radius: 8px;
    background: #fff; font-size: 14px; color: #0E2A47; font-weight: 500;
  }
  .opcao-btn.ativo {
    background: #D6E8F4; border: 2px solid #0E2A47; padding: 13px 7px;
  }

  .lista-tanque {
    border: 1px solid #D6E0EA; border-radius: 8px;
    padding: 12px; margin-bottom: 6px;
    display: flex; align-items: center; gap: 10px; background: #fff;
  }
  .lista-tanque.critico {
    background: #FBE9E5; border: 2px solid #A32D2D; padding: 11px;
  }
  .lista-tanque.alto { border-left: 4px solid #A32D2D; }
  .lista-tanque.medio { border-left: 4px solid #BA7517; }
  .lista-tanque.baixo { border-left: 4px solid #5DCAA5; }
  .lista-tanque.concluido { background: #F2F6FA; opacity: 0.7; }
  .lista-tanque.concluido .lt-nome { text-decoration: line-through; }
  .lt-icone { font-size: 18px; flex-shrink: 0; width: 22px; text-align: center; }
  .lt-corpo { flex: 1; min-width: 0; }
  .lt-nome { font-size: 15px; font-weight: 500; }
  .lt-info { font-size: 11px; color: #5C6B7A; margin-top: 2px; }
  .lista-tanque.critico .lt-nome { color: #501313; font-weight: 600; }
  .lista-tanque.critico .lt-info { color: #791F1F; }
  .lt-seta { color: #8A99A8; font-size: 20px; }

  .alerta {
    padding: 10px 12px; border-radius: 8px;
    font-size: 12px; margin-bottom: 12px;
    display: flex; gap: 8px; align-items: flex-start;
  }
  .alerta.info { background: #D6E8F4; color: #0E2A47; }
  .alerta.warn { background: #FBE9D6; color: #633806; }
  .alerta.danger { background: #FBE9E5; color: #791F1F; }
  .alerta-ico { flex-shrink: 0; font-size: 16px; }

  .sintoma-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 12px;
    border: 1px solid #D6E0EA; border-radius: 8px;
    margin-bottom: 6px; background: #fff; font-size: 14px;
  }
  .sintoma-item.checked {
    border: 1.5px solid #A32D2D; background: #FBE9E5;
    color: #501313; font-weight: 500;
  }
  .sintoma-check {
    width: 20px; height: 20px;
    border: 1.5px solid #B0BDC9; border-radius: 4px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: white;
  }
  .sintoma-item.checked .sintoma-check {
    background: #A32D2D; border-color: #A32D2D;
  }
  .sintoma-cat {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
    color: #8A99A8; margin: 12px 0 6px; font-weight: 600;
  }

  .tipo-coleta-btn {
    width: 100%; padding: 14px;
    border-radius: 8px;
    border: 1.5px solid #D6E0EA; background: #fff;
    text-align: left; margin-bottom: 8px;
    display: flex; align-items: center; gap: 12px; color: #0E2A47;
  }
  .tipo-coleta-btn.ativo {
    border: 2px solid #0E2A47; background: #D6E8F4; padding: 13px;
  }
  .tipo-coleta-btn .tc-icone { font-size: 24px; flex-shrink: 0; }
  .tipo-coleta-btn .tc-titulo { font-size: 15px; font-weight: 600; }
  .tipo-coleta-btn .tc-sub { font-size: 11px; color: #5C6B7A; margin-top: 2px; }

  .volume-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .volume-btn {
    padding: 12px 8px;
    border: 1.5px solid #D6E0EA; background: #fff;
    border-radius: 8px;
    font-size: 14px; color: #0E2A47; font-weight: 500; text-align: center;
  }
  .volume-btn.ativo {
    background: #D6E8F4; border: 2px solid #0E2A47; padding: 11px 7px;
  }
